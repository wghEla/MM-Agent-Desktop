[package]
name = "mmagent-desktop"
version = "1.0.0-rebuild.1"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
