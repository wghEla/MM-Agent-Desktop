name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff
      - name: Ruff
        run: python -m ruff check mmagent tests
      - name: Pytest
        run: python -m pytest -q

  desktop:
    name: Desktop build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sidecar build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[package]"
      - name: Build bundled Python sidecar
        run: python scripts/build_sidecar.py
      - name: Smoke bundled sidecar executable
        shell: pwsh
        run: |
          $triple = rustc --print host-tuple
          $binary = "apps/desktop/src-tauri/binaries/mmagent-sidecar-$triple.exe"
          if (!(Test-Path $binary)) { throw "sidecar missing: $binary" }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw "sidecar --help failed: $LASTEXITCODE" }
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check
