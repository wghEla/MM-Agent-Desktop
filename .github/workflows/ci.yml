name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff
      - name: Ruff
        run: python -m ruff check mmagent tests
      - name: Pytest
        run: python -m pytest -q

  desktop:
    name: Desktop build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sidecar build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[package]"
      - name: Build bundled Python sidecar
        run: python scripts/build_sidecar.py
      - name: Build managed scientific Python runtime
        run: python scripts/build_managed_runtime.py
      - name: Smoke managed scientific runtime
        shell: pwsh
        run: |
          $python = "apps/desktop/src-tauri/resources/runtime/python.exe"
          if (!(Test-Path $python)) { throw "managed Python missing: $python" }
          & $python -X utf8 -c "import numpy,pandas,scipy,matplotlib,sklearn,sympy,statsmodels,openpyxl,xlrd,docx,pypdf,fitz,PIL,networkx,pydantic; print('managed-runtime-ok')"
          if ($LASTEXITCODE -ne 0) { throw "managed runtime smoke failed: $LASTEXITCODE" }
      - name: Smoke bundled sidecar executable
        shell: pwsh
        run: |
          $triple = rustc --print host-tuple
          $binary = "apps/desktop/src-tauri/binaries/mmagent-sidecar-$triple.exe"
          if (!(Test-Path $binary)) { throw "sidecar missing: $binary" }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw "sidecar --help failed: $LASTEXITCODE" }
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check
      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis
      - name: Verify release bundle
        shell: pwsh
        run: |
          $app = "apps/desktop/src-tauri/target/release/mmagent-desktop.exe"
          if (!(Test-Path $app)) { throw "release app missing: $app" }
          $installers = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe"
          if ($installers.Count -lt 1) { throw "NSIS installer missing" }
          $installers | ForEach-Object { Write-Host $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: mmagent-desktop-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
